# SPDX-License-Identifier: Apache-2.0
name: Documentation preview
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    # Same native fallback as Verify: image publication is outside scaffold #1.
    # PR artifact only: no Pages upload, deployment, release or privileged follow-up.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"
          python-version: "3.12.14"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task -t Taskfile.runtime.yml docs:setup
      - run: task -t Taskfile.runtime.yml docs:build
      - run: task -t Taskfile.runtime.yml docs:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: preview
        with:
          name: docs-${{ github.event.pull_request.head.sha }}
          path: artifacts/site
          retention-days: 14
          if-no-files-found: error
      - name: Link review artifact
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "Documentation preview (14 days; not deployed): $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
