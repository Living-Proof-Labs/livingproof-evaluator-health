# SPDX-License-Identifier: Apache-2.0
# Native fallback: no published development image exists. The scaffold in #1
# explicitly excludes publication; AGENTS.md records this local exception.
# Image publication needs separately scoped work before adopting container:.
name: Verify
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: CLI verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"
          python-version: "3.12.14"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task -t Taskfile.runtime.yml setup
      - run: task -t Taskfile.runtime.yml verify
      - name: Publish individual test results
        id: report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Health scaffold tests
          path: artifacts/tests.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
      - name: Retain JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.sha }}
          path: artifacts/tests.xml
          retention-days: 14
          if-no-files-found: error
      - name: Summarize results
        if: ${{ !cancelled() }}
        env:
          PASSED: ${{ steps.report.outputs.passed }}
          FAILED: ${{ steps.report.outputs.failed }}
          SKIPPED: ${{ steps.report.outputs.skipped }}
          CHECK_URL: ${{ steps.report.outputs.url }}
        run: |
          {
            echo "Health scaffold tests: passed=$PASSED failed=$FAILED skipped=$SKIPPED"
            echo "Check: $CHECK_URL"
            echo "Raw JUnit artifact: junit-$GITHUB_SHA (14 days)."
            echo "Fork PRs retain artifacts; individual Checks publication is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"
