# Adapted from collaboration-guidelines v9.9.12 templates/container/Taskfile.yml.
version: '3'
tasks:
  setup:
    desc: Sync locked dependencies in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml setup
  check:
    desc: Check Python in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml check
  test:
    desc: Exercise the CLI in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml test
  verify:
    desc: Run checks and tests in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml verify
  install:test:
    desc: Exercise a clean wheel installation in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml install:test
  docs:setup:
    desc: Install locked documentation tools in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml docs:setup
  docs:build:
    desc: Build the development manual in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml docs:build
  docs:verify:
    desc: Check the rendered manual in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml docs:verify
  docs:test:
    desc: Test documentation publication safeguards in Docker
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml docs:test
  docs:smoke:
    desc: Check the served manual in Docker (pass --url and --commit)
    cmds:
      - docker compose run --rm tooling python tools/docs/smoke.py {{.CLI_ARGS}}
